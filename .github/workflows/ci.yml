# Runs in the public agungkes/useprint-release repository, which holds no source code.
# The private repository's CI dispatcher syncs this file there on pushes to main and
# triggers it with the commit to verify. Logs of successful runs are deleted by
# delete-logs.yml, so avoid printing anything sensitive even in failing steps.
name: CI

on:
  repository_dispatch:
    types: [useprint]
  workflow_dispatch:
    inputs:
      sha:
        description: Full commit SHA in agungkes/useprint
        required: true
      ref:
        description: Source ref, for example refs/heads/main
        required: true
      event:
        description: Source event (push or pull_request)
        required: true
        default: push

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.validate.outputs.sha }}
      staging: ${{ steps.validate.outputs.staging }}
      production: ${{ steps.validate.outputs.production }}
    steps:
      - id: validate
        env:
          SHA: ${{ github.event.client_payload.sha || inputs.sha }}
          REF: ${{ github.event.client_payload.ref || inputs.ref }}
          EVENT: ${{ github.event.client_payload.event || inputs.event }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Source SHA must be a full commit SHA."; exit 1; }
          staging=false
          production=false
          if [[ "$EVENT" == push && "$REF" == refs/heads/main ]]; then staging=true; fi
          if [[ "$EVENT" == push && ( "$REF" == refs/heads/release || "$REF" == refs/heads/release/* ) ]]; then
            production=true
          fi
          { echo "sha=$SHA"; echo "staging=$staging"; echo "production=$production"; } >> "$GITHUB_OUTPUT"
      - name: Mark source commit pending
        env:
          GH_TOKEN: ${{ secrets.USEPRINT_REPO_TOKEN }}
          SHA: ${{ steps.validate.outputs.sha }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X POST "repos/agungkes/useprint/statuses/$SHA" -f state=pending \
            -f context=useprint-release/ci -f target_url="$TARGET" > /dev/null

  verify:
    needs: [source]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: agungkes/useprint
          ref: ${{ needs.source.outputs.sha }}
          token: ${{ secrets.USEPRINT_REPO_TOKEN }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm verify:release-record
      - run: pnpm test:scripts
      - run: pnpm typecheck
      - run: pnpm --filter @useprint/docs test
      - run: pnpm --filter @useprint/docs build
      - run: pnpm --filter @useprint/web db:rehearse:recovery
      - run: pnpm test
      # Coverage thresholds still gate the run; reports are not published from a public repository.
      - run: pnpm --filter @useprint/web test:coverage
      - run: pnpm build
      - run: pnpm --filter @useprint/web build:audit
      - run: pnpm --filter @useprint/web build:budget
      - run: pnpm --filter @useprint/web test:scripts

  e2e:
    needs: [source]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          repository: agungkes/useprint
          ref: ${{ needs.source.outputs.sha }}
          token: ${{ secrets.USEPRINT_REPO_TOKEN }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @useprint/web exec playwright install --with-deps chromium
      # Playwright traces are not uploaded: they would expose application source publicly.
      - run: pnpm test:e2e

  deploy-staging:
    if: ${{ needs.source.outputs.staging == 'true' }}
    needs: [source, verify, e2e]
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          repository: agungkes/useprint
          ref: ${{ needs.source.outputs.sha }}
          token: ${{ secrets.USEPRINT_REPO_TOKEN }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy staging
        run: pnpm --filter @useprint/web deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          USEPRINT_SMOKE_INVITE_EMAIL: ${{ secrets.USEPRINT_SMOKE_INVITE_EMAIL }}
          VITE_DOCS_URL: ${{ vars.VITE_DOCS_URL }}

  deploy-landing-staging:
    if: ${{ needs.source.outputs.staging == 'true' }}
    needs: [source, verify, e2e]
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-landing-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          repository: agungkes/useprint
          ref: ${{ needs.source.outputs.sha }}
          token: ${{ secrets.USEPRINT_REPO_TOKEN }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy landing staging
        run: pnpm --filter @useprint/landing deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
          VITE_LANDING_URL: ${{ vars.VITE_LANDING_URL }}

  deploy-docs-staging:
    if: ${{ needs.source.outputs.staging == 'true' }}
    needs: [source, verify]
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: deploy-docs-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          repository: agungkes/useprint
          ref: ${{ needs.source.outputs.sha }}
          token: ${{ secrets.USEPRINT_REPO_TOKEN }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy docs staging
        run: pnpm --filter @useprint/docs deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}

  deploy-production:
    if: ${{ needs.source.outputs.production == 'true' }}
    needs: [source, verify, e2e]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          repository: agungkes/useprint
          ref: ${{ needs.source.outputs.sha }}
          token: ${{ secrets.USEPRINT_REPO_TOKEN }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy production
        run: pnpm --filter @useprint/web deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_COMMIT_SHA: ${{ vars.RELEASE_COMMIT_SHA }}
          RELEASE_RECORD: ${{ vars.RELEASE_RECORD }}
          USEPRINT_PREMIGRATION_EXPORT_RELEASE_RECORD: ${{ vars.USEPRINT_PREMIGRATION_EXPORT_RELEASE_RECORD }}
          USEPRINT_SMOKE_INVITE_EMAIL: ${{ secrets.USEPRINT_SMOKE_INVITE_EMAIL }}
          USEPRINT_SMOKE_ORIGIN: ${{ vars.USEPRINT_SMOKE_ORIGIN }}
          VITE_DOCS_URL: ${{ vars.VITE_DOCS_URL }}

  deploy-docs-production:
    if: ${{ needs.source.outputs.production == 'true' }}
    needs: [source, deploy-production]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-docs-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          repository: agungkes/useprint
          ref: ${{ needs.source.outputs.sha }}
          token: ${{ secrets.USEPRINT_REPO_TOKEN }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy docs production
        run: pnpm --filter @useprint/docs deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}

  deploy-landing-production:
    if: ${{ needs.source.outputs.production == 'true' }}
    needs: [source, deploy-production]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: deploy-landing-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          repository: agungkes/useprint
          ref: ${{ needs.source.outputs.sha }}
          token: ${{ secrets.USEPRINT_REPO_TOKEN }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy landing production
        run: pnpm --filter @useprint/landing deploy:production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
          VITE_LANDING_URL: ${{ vars.VITE_LANDING_URL }}

  report:
    if: ${{ always() && needs.source.result == 'success' }}
    needs:
      - source
      - verify
      - e2e
      - deploy-staging
      - deploy-landing-staging
      - deploy-docs-staging
      - deploy-production
      - deploy-docs-production
      - deploy-landing-production
    runs-on: ubuntu-latest
    steps:
      - name: Report result to source commit
        env:
          GH_TOKEN: ${{ secrets.USEPRINT_REPO_TOKEN }}
          SHA: ${{ needs.source.outputs.sha }}
          STATE: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'failure' || 'success' }}
          TARGET: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api -X POST "repos/agungkes/useprint/statuses/$SHA" -f state="$STATE" \
            -f context=useprint-release/ci -f target_url="$TARGET" > /dev/null
